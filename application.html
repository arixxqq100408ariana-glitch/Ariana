<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Учусь.РФ - Оформление заявки</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header id="mainHeader">
            <div class="header-content">
                <div class="logo">
                    <a href="dashboard.html" class="logo-link" title="На главную">
                        <img src="./img/XXL_height2.png" alt="Учусь.РФ" class="logo-img" />
                    </a>
                    <span>Учусь.РФ</span>
                </div>
                <nav id="mainNav">
                    <a href="dashboard.html" class="nav-btn">Кабинет</a>
                    <a href="index.html" id="navLogout" class="nav-btn logout-btn">Выйти</a>
                </nav>
            </div>
        </header>

        <!-- Основной контент -->
        <main>
            <div class="page-container">
                <div class="form-card">
                    <h2>Оформление заявки</h2>
                    <p class="subtitle">Выберите курс и укажите детали</p>
                    <form id="applicationForm" novalidate>
                        <div class="form-group">
                            <label>Вид курса</label>
                            <select id="appCourse" required>
                                <option value="">Выберите курс...</option>
                                <option value="Повышение квалификации">Повышение квалификации</option>
                                <option value="Профессиональная переподготовка">Профессиональная переподготовка</option>
                                <option value="Охрана труда">Охрана труда</option>
                                <option value="Пожарная безопасность">Пожарная безопасность</option>
                                <option value="ГО и ЧС">ГО и ЧС</option>
                            </select>
                            <span class="error-message" id="appCourseError"></span>
                        </div>
                        <div class="form-group">
                            <label>Дата начала</label>
                            <input type="text" id="appDate" placeholder="ДД.ММ.ГГГГ" required />
                            <span class="error-message" id="appDateError"></span>
                        </div>
                        <div class="form-group">
                            <label>Способ оплаты</label>
                            <select id="appPayment" required>
                                <option value="">Выберите способ...</option>
                                <option value="Предоплата по QR-коду">Предоплата по QR-коду</option>
                                <option value="Оплата картой МИР">Оплата картой МИР</option>
                                <option value="Постоплата в офисе">Постоплата в офисе</option>
                            </select>
                            <span class="error-message" id="appPaymentError"></span>
                        </div>
                        <div class="form-actions">
                            <a href="dashboard.html" class="btn-secondary">Отмена</a>
                            <button type="submit" class="btn-primary">Отправить заявку</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- ФУТЕР -->
        <footer id="mainFooter">
            <div class="footer-content">
                <div class="footer-left">
                    <div class="footer-logo">
                        <img src="./img/XXL_height2.png" alt="Учусь.РФ" class="footer-logo-img" />
                        <span>Учусь.РФ</span>
                    </div>
                    <p class="footer-copy">© 2026 Учусь.РФ. Все права защищены.</p>
                </div>
                <div class="footer-center">
                    <p class="footer-slogan">Образование, доступное каждому</p>
                </div>
                <div class="footer-right">
                    <div class="social-icons">
                        <a href="#" class="social-link" title="ВКонтакте" target="_blank">
                            <img src="./img/soc1.png" alt="ВК" class="social-img" />
                        </a>
                        <a href="#" class="social-link" title="Одноклассники" target="_blank">
                            <img src="./img/soc2.png" alt="ОК" class="social-img" />
                        </a>
                    </div>
                    <p class="footer-email">info@uchus.ru</p>
                </div>
            </div>
        </footer>

        <!-- Модальное окно уведомления -->
        <div id="notificationModal" class="modal">
            <div class="modal-content notification-content">
                <h3 id="notifTitle">Успешно!</h3>
                <p id="notifMessage">Действие выполнено.</p>
                <button id="notifCloseBtn" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
