<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Учусь.РФ - Регистрация</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header id="mainHeader">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html" class="logo-link" title="На главную">
                        <img src="./img/XXL_height2.png" alt="Учусь.РФ" class="logo-img" />
                    </a>
                    <span>Учусь.РФ</span>
                </div>
                <nav id="mainNav">
                    <a href="index.html" class="nav-btn">Вход</a>
                    <a href="register.html" class="nav-btn active">Регистрация</a>
                </nav>
            </div>
        </header>

        <!-- Основной контент -->
        <main>
            <div class="page-container">
                <div class="form-card">
                    <h1>Регистрация</h1>
                    <p class="subtitle">Создайте аккаунт для доступа к курсам</p>
                    <form id="registerForm" novalidate>
                        <div class="form-group">
                            <label>Логин</label>
                            <input type="text" id="regLogin" placeholder="минимум 6 символов (латиница + цифры)" required />
                            <span class="error-message" id="regLoginError"></span>
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" id="regPassword" placeholder="минимум 8 символов" required />
                            <span class="error-message" id="regPasswordError"></span>
                        </div>
                        <div class="form-group">
                            <label>ФИО</label>
                            <input type="text" id="regFullname" placeholder="Иванов Иван Иванович" required />
                            <span class="error-message" id="regFullnameError"></span>
                        </div>
                        <div class="form-group">
                            <label>Телефон</label>
                            <input type="tel" id="regPhone" placeholder="+7 (999) 123-45-67" required />
                            <span class="error-message" id="regPhoneError"></span>
                        </div>
                        <div class="form-group">
                            <label>E-mail</label>
                            <input type="email" id="regEmail" placeholder="example@mail.ru" required />
                            <span class="error-message" id="regEmailError"></span>
                        </div>
                        <button type="submit" class="btn-primary btn-full">Зарегистрироваться</button>
                    </form>
                    <div class="form-footer">
                        <span>Уже есть аккаунт?</span>
                        <a href="index.html" class="link-btn">Войти</a>
                    </div>
                </div>
            </div>
        </main>

        <!-- ФУТЕР -->
        <footer id="mainFooter">
            <div class="footer-content">
                <div class="footer-left">
                    <div class="footer-logo">
                        <img src="./img/XXL_height2.png" alt="Учусь.РФ" class="footer-logo-img" />
                        <span>Учусь.РФ</span>
                    </div>
                    <p class="footer-copy">© 2026 Учусь.РФ. Все права защищены.</p>
                </div>
                <div class="footer-center">
                    <p class="footer-slogan">Образование, доступное каждому</p>
                </div>
                <div class="footer-right">
                    <div class="social-icons">
                        <a href="#" class="social-link" title="ВКонтакте" target="_blank">
                            <img src="./img/soc1.png" alt="ВК" class="social-img" />
                        </a>
                        <a href="#" class="social-link" title="Одноклассники" target="_blank">
                            <img src="./img/soc2.png" alt="ОК" class="social-img" />
                        </a>
                    </div>
                    <p class="footer-email">info@uchus.ru</p>
                </div>
            </div>
        </footer>

        <!-- Модальное окно уведомления -->
        <div id="notificationModal" class="modal">
            <div class="modal-content notification-content">
                <h3 id="notifTitle">Успешно!</h3>
                <p id="notifMessage">Действие выполнено.</p>
                <button id="notifCloseBtn" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
